<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="660" fill="#ffffff"/>
  <text x="460" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Campus security-operations agent: four-layer architecture</text>

  <!-- campus boundary -->
  <rect x="18" y="42" width="884" height="592" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5" rx="10"/>
  <text x="34" y="64" font-size="12.5" font-weight="bold" fill="#c0392b">Campus network boundary (G1: data and inference never leave campus)</text>

  <!-- users -->
  <rect x="300" y="76" width="320" height="46" rx="8" fill="#eef3fa" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="460" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3a5b">Operators</text>
  <text x="460" y="113" text-anchor="middle" font-size="11" fill="#333">informatization-center security &amp; network staff</text>
  <line x1="460" y1="122" x2="460" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="142" font-size="10.5" fill="#444">natural language</text>

  <!-- layer 3: agent platform -->
  <rect x="240" y="152" width="440" height="66" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="460" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d5c38">Layer 3 · Agent platform (MCP-compatible runtime)</text>
  <text x="460" y="192" text-anchor="middle" font-size="11" fill="#333">ReAct-style loop · conversation state · tool-call rendering</text>
  <text x="460" y="208" text-anchor="middle" font-size="10.5" fill="#666">front-end neutral (G4): swappable chat product; guardrails travel with tools</text>

  <!-- arrows agent <-> LLM and agent <-> MCP -->
  <line x1="300" y1="218" x2="170" y2="286" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="286" x2="290" y2="218" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="250" font-size="10.5" fill="#444">OpenAI-style</text>
  <text x="150" y="263" font-size="10.5" fill="#444">inference API</text>
  <line x1="560" y1="218" x2="600" y2="286" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="640" y1="286" x2="620" y2="218" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="640" y="248" font-size="10.5" fill="#444">MCP · streamable-HTTP</text>
  <text x="640" y="261" font-size="10.5" fill="#444">(Token auth) / stdio</text>

  <!-- LLM service -->
  <rect x="40" y="288" width="330" height="92" rx="8" fill="#f3ecf7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="205" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a2a6e">Layer 4 · Campus LLM service</text>
  <text x="205" y="328" text-anchor="middle" font-size="11" fill="#333">private AI gateway (13 on-campus capabilities)</text>
  <text x="205" y="344" text-anchor="middle" font-size="11" fill="#333">chat LLM [[model/size placeholder]] · embedding · rerank</text>
  <text x="205" y="360" text-anchor="middle" font-size="10.5" fill="#666">Bearer-key gateway · health probes · 6000 s budget</text>

  <!-- Layer 2: MCP tool layer -->
  <rect x="420" y="288" width="460" height="150" rx="8" fill="#fff7e8" stroke="#b07a1e" stroke-width="1.8"/>
  <text x="650" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410">Layer 2 · MCP tool server (Django 5.2 + MCP SDK, ~3.8k LOC)</text>
  <!-- six class chips -->
  <g font-size="10.5" fill="#5b4310" text-anchor="middle">
    <rect x="436" y="322" width="136" height="22" rx="5" fill="#fdeecd" stroke="#d9b978"/><text x="504" y="337">Asset ×5</text>
    <rect x="582" y="322" width="136" height="22" rx="5" fill="#fdeecd" stroke="#d9b978"/><text x="650" y="337">Organization ×2</text>
    <rect x="728" y="322" width="138" height="22" rx="5" fill="#fdeecd" stroke="#d9b978"/><text x="797" y="337">Security logs ×6</text>
    <rect x="436" y="350" width="136" height="22" rx="5" fill="#fdeecd" stroke="#d9b978"/><text x="504" y="365">Threat disposition ×4</text>
    <rect x="582" y="350" width="136" height="22" rx="5" fill="#fdeecd" stroke="#d9b978"/><text x="650" y="365">Statistics ×4</text>
    <rect x="728" y="350" width="138" height="22" rx="5" fill="#fdeecd" stroke="#d9b978"/><text x="797" y="365">Projects ×2</text>
  </g>
  <text x="650" y="392" text-anchor="middle" font-size="11" fill="#5b4310">23 tools · schema auto-derived from typed signatures + contract docstrings</text>
  <text x="650" y="408" text-anchor="middle" font-size="10.5" fill="#8a5a00">guardrails R1–R4 (epistemic, in descriptions) · R5–R8 (hard, in code)</text>
  <text x="650" y="424" text-anchor="middle" font-size="10.5" fill="#8a5a00">TokenAuth middleware · sync_to_async adapter · audit marker creator="MCP"</text>

  <!-- arrows tool layer -> substrate -->
  <line x1="520" y1="438" x2="330" y2="500" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="438" x2="620" y2="500" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="790" y1="438" x2="830" y2="500" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="352" y="468" font-size="10.5" fill="#444">SQL (read-only)</text>
  <text x="596" y="468" font-size="10.5" fill="#444">ES DSL / mail API</text>
  <text x="812" y="468" font-size="10.5" fill="#444">blocklist rows</text>

  <!-- Layer 1: substrate -->
  <rect x="40" y="502" width="840" height="112" rx="8" fill="#eef1f4" stroke="#5c6b7a" stroke-width="1.6"/>
  <text x="460" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#33434f">Layer 1 · Campus substrate (production)</text>
  <g font-size="10.5" text-anchor="middle" fill="#22333f">
    <rect x="56" y="536" width="180" height="56" rx="6" fill="#dfe6ec" stroke="#8fa0af"/>
    <text x="146" y="556" font-weight="bold">NSGP ledgers (MySQL)</text>
    <text x="146" y="571">assets · orgs · bulletins</text>
    <text x="146" y="584">MLPS · projects · blocklists</text>
    <rect x="250" y="536" width="170" height="56" rx="6" fill="#dfe6ec" stroke="#8fa0af"/>
    <text x="335" y="556" font-weight="bold">Elasticsearch</text>
    <text x="335" y="571">web-access · Wi-Fi auth</text>
    <text x="335" y="584">DNS-query (monthly idx)</text>
    <rect x="434" y="536" width="150" height="56" rx="6" fill="#dfe6ec" stroke="#8fa0af"/>
    <text x="509" y="556" font-weight="bold">Corp mail API</text>
    <text x="509" y="571">subject search</text>
    <text x="509" y="584">+ hit registration</text>
    <rect x="600" y="536" width="266" height="56" rx="6" fill="#e8eef5" stroke="#8fa0af" stroke-dasharray="5 3"/>
    <text x="733" y="556" font-weight="bold">Enforcement (platform sync jobs only)</text>
    <text x="733" y="571">Kong reverse-proxy blacklist · DNS sinkhole</text>
    <text x="733" y="584">two-phase: registration → async enforcement (R7)</text>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
</svg>
