<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
  <text x="460" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Two-phase disposition: blocklist registration vs. enforcement (R2/R6/R7)</text>

  <!-- lane headers -->
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <rect x="20"  y="48" width="130" height="34" rx="6" fill="#eef3fa" stroke="#2c5f8a"/><text x="85"  y="69" fill="#1b3a5b">Operator</text>
    <rect x="170" y="48" width="130" height="34" rx="6" fill="#eaf6ee" stroke="#2e7d4f"/><text x="235" y="69" fill="#1d5c38">Agent (LLM)</text>
    <rect x="320" y="48" width="150" height="34" rx="6" fill="#fff7e8" stroke="#b07a1e"/><text x="395" y="69" fill="#7a5410">MCP tool server</text>
    <rect x="490" y="48" width="130" height="34" rx="6" fill="#eef1f4" stroke="#5c6b7a"/><text x="555" y="69" fill="#33434f">NSGP ledger</text>
    <rect x="640" y="48" width="130" height="34" rx="6" fill="#eef1f4" stroke="#5c6b7a"/><text x="705" y="69" fill="#33434f">Sync job</text>
    <rect x="790" y="48" width="120" height="34" rx="6" fill="#eef1f4" stroke="#5c6b7a"/><text x="850" y="69" fill="#33434f">Kong / DNS</text>
  </g>
  <!-- lifelines -->
  <g stroke="#b9c4cd" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="85" y1="82" x2="85" y2="440"/><line x1="235" y1="82" x2="235" y2="440"/>
    <line x1="395" y1="82" x2="395" y2="440"/><line x1="555" y1="82" x2="555" y2="440"/>
    <line x1="705" y1="82" x2="705" y2="440"/><line x1="850" y1="82" x2="850" y2="440"/>
  </g>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#222">
    <!-- 1 operator -> agent -->
    <line x1="85" y1="108" x2="235" y2="108" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="90" y="100">“block these attacker IPs …”</text>
    <!-- 2 agent restates for confirmation -->
    <line x1="235" y1="140" x2="85" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="92" y="132">restate target list — confirm (R7 human checkpoint)</text>
    <!-- 3 agent -> tool -->
    <line x1="235" y1="176" x2="395" y2="176" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="243" y="168">add_black_ip(ips, reason, source)</text>
    <!-- 4 tool internal check -->
    <rect x="312" y="190" width="170" height="40" rx="6" fill="#fdf3da" stroke="#d9b978"/>
    <text x="397" y="206" text-anchor="middle">per-item check (R6): syntax,</text>
    <text x="397" y="220" text-anchor="middle">exact dup, CIDR-coverage (R4)</text>
    <!-- 5 tool -> ledger insert -->
    <line x1="395" y1="248" x2="555" y2="248" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="403" y="240">insert new rows (status=blocked,</text>
    <text x="403" y="262">creator="MCP", sync pending)</text>
    <!-- 6 tool -> agent results -->
    <line x1="395" y1="292" x2="235" y2="292" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="243" y="284">per-item {added/existing/covered/invalid}</text>
    <text x="243" y="306">+ note: registered, enforcement pending (R2)</text>
    <!-- 7 agent -> operator answer -->
    <line x1="235" y1="332" x2="85" y2="332" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="92" y="324">answer relays per-item state + pending note</text>
    <!-- 8 async sync -->
    <rect x="640" y="248" width="130" height="26" fill="none"/>
    <line x1="555" y1="368" x2="705" y2="368" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
    <text x="563" y="360">async: platform job pulls full blocked list</text>
    <line x1="705" y1="398" x2="850" y2="398" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
    <text x="712" y="390">push blacklist / DNS sinkhole</text>
    <text x="712" y="418" font-size="10" fill="#666">domains marked synced after push</text>
  </g>

  <rect x="60" y="428" width="800" height="30" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-dasharray="5 3"/>
  <text x="460" y="447" text-anchor="middle" font-size="10.5" fill="#7c2319">The tool layer cannot enforce: worst case of a manipulated write = one queued ledger row a human sees before the sync job runs.</text>
</svg>
